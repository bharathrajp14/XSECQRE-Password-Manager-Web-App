{% extends "base.html" %}
{% block title %}Password Manager{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4 text-center">Your Passwords</h2>

  <div class="card mb-4">
    <div class="card-body">
      <form method="POST" action="{{ url_for('views.add_password') }}">
        <div class="row g-2">
          <div class="col-md-3">
            <input type="text" class="form-control" name="site_name" placeholder="Site Name" required>
          </div>
          <div class="col-md-4">
            <input type="url" class="form-control" name="site_url" placeholder="Site URL">
          </div>
          <div class="col-md-3">
            <input type="password" class="form-control" name="site_password" placeholder="Password" required autocomplete="new-password">
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-success w-100">Add</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>Site Name</th>
        <th>URL</th>
        <th>Password</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for p in passwords %}
      {% set edit_form = 'edit-password-' ~ p.id %}
      <tr>
        <td>
          <form id="{{ edit_form }}" method="POST" action="{{ url_for('views.edit_password', id=p.id) }}"></form>
          <input form="{{ edit_form }}" type="text" class="form-control" name="site_name" value="{{ p.site_name }}" required>
        </td>
        <td><input form="{{ edit_form }}" type="url" class="form-control" name="site_url" value="{{ p.site_url or '' }}"></td>
        <td><input form="{{ edit_form }}" type="password" class="form-control" name="site_password" value="" placeholder="Enter to replace" required autocomplete="new-password"></td>
        <td class="d-flex gap-1">
          <button form="{{ edit_form }}" type="submit" class="btn btn-primary btn-sm">Update</button>
          <form method="POST" action="{{ url_for('views.delete_password', id=p.id) }}" onsubmit="return confirm('Delete this password?');">
            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="text-center text-muted">No saved passwords yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
